name: The Wigology — automated tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *' # 04:00 in South Africa; GitHub may delay scheduled jobs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wigology-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Python syntax checks
        run: python -m compileall -q main.py pricing_studio.py
      - name: Lint critical Python errors
        run: ruff check --select E9,F63,F7,F82 main.py pricing_studio.py tests/
      - name: Scan Python code for higher-severity security issues
        run: bandit -q -r main.py pricing_studio.py -ll
      - name: Run catalog, pricing, login and customer journey tests
        run: python -m pytest -q tests/

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium
      - name: Start Wigology locally for browser tests
        run: |
          python -m streamlit run main.py --server.headless true --server.port 8501 > /tmp/wigology-streamlit.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8501/_stcore/health > /dev/null; then
              echo 'Streamlit server is ready'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wigology-streamlit.log
          exit 1
      - name: Run real Chromium customer journey tests
        run: python -m pytest -q tests_browser/
      - name: Print Streamlit logs if tests fail
        if: failure()
        run: cat /tmp/wigology-streamlit.log || true
